{# One post summary card. Used on the home page and author pages. #}
<article class="card">
  {% if post.image %}
  <a href="{{ post.url }}" class="card-image"><img src="{{ post.image }}" alt="{{ post.title }}" loading="lazy"></a>
  {% endif %}
  <div class="card-text">
    <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
    {% if post.author %}<p class="byline">By <strong>{{ post.author }}</strong></p>{% endif %}
    <p class="summary">{{ post.summary }}</p>
    <a href="{{ post.url }}" class="read-more">read more</a>
  </div>
</article>
